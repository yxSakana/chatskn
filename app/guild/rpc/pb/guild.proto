syntax = "proto3";

option go_package = "./pb";
package pb;

message Guild {
  int64 id = 1;
  int64 ownerId = 2;
  string name = 3;
}
message ChannelMember {
  int64 id = 1;
  int64 channelId = 2;
  int64 userId = 3;
  int64 role = 4;
}

message CreateReq {
  int64 ownerId = 1;
  string name = 2;
}
message CreateResp {
  int64 id = 1;
}

message CreateChannelReq {
  int64 guildId = 1;
  int64 name = 2;
}
message CreateChannelResp {
  int64 id = 1;
}

message GetChannelMembersReq {
  int64 id = 1;
}
message GetChannelMembersResp {
  repeated ChannelMember membersInfo = 1;
}

// -- service --
service guild {
  rpc create(CreateReq) returns(CreateResp);
  rpc createChannel(CreateChannelReq) returns(CreateChannelResp);

//  rpc get() returns();
//  rpc delete() returns();
//  rpc createChannel() returns():
//  rpc inviteUser() returns();
  // channel
  rpc getChannelMembers(GetChannelMembersReq) returns(GetChannelMembersResp);
}
